<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlog英语 · 永久会员</title>
<style>
/* ── 基础重置 ── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d0d;--bg2:#181818;--bg3:#222;--bg4:#2a2a2a;
  --text:#e4e2db;--text2:#999;--text3:#555;
  --gold:#f5a623;--gold2:#c07800;--gold-bg:rgba(245,166,35,0.1);--gold-border:rgba(245,166,35,0.3);
  --blue:#5ba3e8;--blue-bg:rgba(91,163,232,0.1);--blue-border:rgba(91,163,232,0.3);
  --green:#4caf50;--green-bg:rgba(76,175,80,0.1);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --radius:8px;--radius-lg:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.6;overflow-x:hidden;}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}

/* ── 登录页 ── */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:40px 36px;width:100%;max-width:360px;text-align:center;}
.login-logo{font-size:22px;font-weight:600;margin-bottom:8px;letter-spacing:-0.3px;}
.login-logo span{color:var(--gold);}
.login-sub{font-size:12px;color:var(--text2);margin-bottom:32px;}
.login-box input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;margin-bottom:10px;outline:none;transition:border-color 0.15s;}
.login-box input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:11px;background:var(--gold);color:#000;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.15s;margin-top:4px;}
.login-btn:hover{opacity:0.88;}
.login-err{font-size:12px;color:#e74c3c;margin-top:8px;min-height:18px;}
.login-note{font-size:11px;color:var(--text3);margin-top:20px;}

/* ── 主应用 ── */
#app{display:none;height:100vh;display:none;flex-direction:column;}
#app.show{display:flex;}

/* ── 顶栏 ── */
.topbar{height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100;}
.logo{font-size:16px;font-weight:600;letter-spacing:-0.3px;white-space:nowrap;}
.logo span{color:var(--gold);}
.ep-selector{flex:1;max-width:320px;}
.ep-selector select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:5px 10px;border-radius:var(--radius);font-size:12px;cursor:pointer;outline:none;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.member-badge{font-size:11px;background:var(--gold-bg);color:var(--gold);padding:3px 8px;border-radius:12px;border:1px solid var(--gold-border);white-space:nowrap;}
.logout-btn{font-size:11px;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:var(--radius);border:1px solid var(--border);}
.logout-btn:hover{color:var(--text);}

/* ── 桌面布局 ── */
.desktop-layout{flex:1;display:grid;grid-template-columns:200px 1fr 260px;overflow:hidden;}

/* ── 侧边栏 ── */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}
.sidebar-head{padding:12px 14px 8px;font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;}
.ep-item{padding:9px 14px;cursor:pointer;border-left:2px solid transparent;transition:all 0.12s;display:flex;align-items:center;gap:8px;}
.ep-item:hover{background:var(--bg3);}
.ep-item.active{background:var(--bg3);border-left-color:var(--gold);}
.ep-num{width:28px;height:28px;border-radius:6px;background:var(--bg4);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.ep-item.active .ep-num{background:var(--gold-bg);color:var(--gold);}
.ep-meta{flex:1;min-width:0;}
.ep-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.ep-dur{font-size:10px;color:var(--text3);margin-top:1px;}
.ep-new{font-size:9px;background:var(--gold-bg);color:var(--gold);padding:1px 5px;border-radius:8px;flex-shrink:0;}

/* ── 中间内容区 ── */
.content{display:flex;flex-direction:column;overflow:hidden;}
.video-wrap{background:#000;position:relative;flex-shrink:0;}
.video-wrap video{width:100%;display:block;max-height:42vh;}
.no-video{aspect-ratio:16/9;max-height:42vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text2);font-size:13px;background:#000;}
.no-video-icon{width:48px;height:48px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.no-video-icon svg{fill:#000;margin-left:3px;}

/* ── 播放控制 ── */
.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:7px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.prog-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:120px;}
.prog-wrap input[type=range]{flex:1;height:3px;accent-color:var(--gold);cursor:pointer;}
.time-lbl{font-size:10px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums;}
.ctrl-group{display:flex;gap:3px;}
.cbtn{padding:3px 9px;border:1px solid var(--border2);border-radius:5px;background:none;color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.12s;}
.cbtn:hover,.cbtn.on{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
.cbtn.icon-btn{padding:3px 7px;}

/* ── 模式选择器 ── */
.mode-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.mode-lbl{font-size:10px;color:var(--text3);margin-right:2px;}
.mbtn{padding:3px 10px;border:1px solid var(--border);border-radius:5px;background:none;color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.12s;}
.mbtn:hover{background:var(--bg3);}
.mbtn.on{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
.mbtn.on.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border);}
.mbtn.on.green{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,80,0.3);}

/* ── 字幕区 ── */
.hint-strip{padding:5px 12px;font-size:11px;color:var(--text2);background:var(--bg3);border-bottom:1px solid var(--border);}
.subtitle-area{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
.sub-row{padding:9px 11px;border-radius:var(--radius);border:1px solid transparent;cursor:default;transition:all 0.12s;position:relative;}
.sub-row:hover{background:var(--bg3);}
.sub-row.active-line{background:var(--bg3);border-color:rgba(245,166,35,0.25);}
.sub-row.active-line .en-line{color:var(--gold);}
.sub-row.sent-hl{background:var(--blue-bg);border-color:var(--blue-border);}
.sub-row.has-note{border-left:2px solid var(--green);border-radius:0 var(--radius) var(--radius) 0;}
.sub-ts{font-size:10px;color:var(--text3);margin-bottom:3px;cursor:pointer;}
.sub-ts:hover{color:var(--gold);}
.en-line{font-size:13px;line-height:1.7;color:var(--text);user-select:text;}
.zh-line{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.5;}
.hl-word{background:rgba(245,166,35,0.15);color:var(--gold);border-radius:3px;padding:0 2px;border-bottom:1px dashed var(--gold);cursor:pointer;font-weight:500;}
.hl-phrase{background:var(--blue-bg);color:var(--blue);border-radius:3px;padding:0 2px;border-bottom:1px dashed var(--blue);}
.user-hl{background:rgba(245,166,35,0.2);border-radius:3px;padding:0 2px;border-bottom:2px solid var(--gold);}
.sent-actions{display:none;margin-top:7px;gap:5px;flex-wrap:wrap;}
.sent-actions.show{display:flex;}
.sa-btn{padding:3px 9px;border:1px solid var(--border2);border-radius:5px;background:none;color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;transition:all 0.12s;}
.sa-btn:hover{background:var(--bg4);}

/* ── 右侧词汇面板 ── */
.vocab-panel{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.vtab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.vtab{flex:1;padding:9px 4px;text-align:center;font-size:11px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.12s;}
.vtab:hover{color:var(--text);}
.vtab.on{color:var(--gold);border-bottom-color:var(--gold);}
.vpanel{flex:1;overflow-y:auto;padding:10px;}
.vpanel{display:none;}
.vpanel.on{display:block;}
.vsec-title{font-size:10px;color:var(--text3);letter-spacing:0.05em;margin-bottom:6px;}

.wcard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:11px;margin-bottom:8px;cursor:pointer;transition:border-color 0.12s;}
.wcard:hover{border-color:var(--gold-border);}
.wcard-head{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
.wword{font-size:15px;font-weight:600;color:var(--gold);}
.wph{font-size:10px;color:var(--text2);font-style:italic;}
.wpos{font-size:9px;background:var(--bg4);color:var(--text2);padding:1px 5px;border-radius:3px;margin-left:auto;}
.wmean{font-size:12px;color:var(--text);margin-bottom:4px;}
.wex{font-size:11px;color:var(--text2);font-style:italic;line-height:1.5;padding:5px 8px;background:var(--bg4);border-radius:5px;}
.wtags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.wtag{font-size:10px;background:var(--gold-bg);color:var(--gold);padding:2px 7px;border-radius:10px;border:1px solid var(--gold-border);}

.pcard{background:var(--bg3);border:1px solid var(--blue-border);border-radius:var(--radius);padding:11px;margin-bottom:8px;}
.pp{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:4px;}
.pm{font-size:12px;color:var(--text);margin-bottom:4px;}
.pe{font-size:11px;color:var(--text2);font-style:italic;margin-bottom:6px;}
.alt-lbl{font-size:10px;color:var(--text3);margin-bottom:3px;}
.atag{font-size:10px;background:var(--blue-bg);color:var(--blue);padding:2px 7px;border-radius:10px;display:inline-block;margin:2px;}

.nb-empty{text-align:center;padding:24px 8px;color:var(--text3);font-size:12px;}
.nb-word-chip{display:inline-flex;align-items:center;gap:4px;background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:10px;padding:3px 8px;font-size:11px;color:var(--gold);margin:2px;cursor:pointer;}
.nb-word-chip:hover{opacity:0.7;}
.nb-sent{padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;}
.nb-sent:last-child{border-bottom:none;}
.nb-sent-en{color:var(--text);margin-bottom:2px;}
.nb-sent-zh{color:var(--text2);}
.nb-sent-note{color:var(--green);font-style:italic;margin-top:3px;}
.nb-note-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;}
.nb-note-kw{color:var(--gold);margin-bottom:2px;}
.nb-note-txt{color:var(--text2);}
.exp-btn{width:100%;padding:7px;margin-top:8px;border:1px solid var(--border2);border-radius:var(--radius);background:none;color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.12s;}
.exp-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ── 弹窗：单词详情 ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:20px;width:100%;max-width:300px;position:relative;}
.modal-close{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--text2);font-size:16px;line-height:1;}
.modal-close:hover{color:var(--text);}
.modal-word{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:2px;}
.modal-ph{font-size:12px;color:var(--text2);margin-bottom:10px;}
.modal-mean{font-size:14px;color:var(--text);margin-bottom:8px;}
.modal-ex{font-size:12px;color:var(--text2);font-style:italic;background:var(--bg3);padding:8px 10px;border-radius:var(--radius);line-height:1.6;margin-bottom:10px;}
.modal-syns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px;}
.modal-save{width:100%;padding:9px;background:var(--gold);color:#000;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.modal-save:hover{opacity:0.85;}

/* ── 弹窗：笔记 ── */
.note-modal{max-width:340px;}
.note-modal .nm-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;}
.note-modal .nm-quote{font-size:11px;color:var(--text2);font-style:italic;margin-bottom:10px;line-height:1.5;}
.note-modal textarea{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;resize:none;outline:none;font-family:inherit;transition:border-color 0.15s;}
.note-modal textarea:focus{border-color:var(--gold);}
.nm-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
.nm-cancel{padding:7px 14px;border:1px solid var(--border2);border-radius:var(--radius);background:none;color:var(--text2);font-size:12px;cursor:pointer;}
.nm-save{padding:7px 16px;background:var(--gold);color:#000;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;}

/* ── 手机底部导航 ── */
.mobile-nav{display:none;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.mnav-items{display:flex;}
.mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;color:var(--text3);font-size:10px;transition:color 0.12s;}
.mnav-item.on{color:var(--gold);}
.mnav-icon{font-size:18px;line-height:1;}

/* ── 手机面板切换 ── */
.mobile-panels{display:none;}

/* ── 响应式 ── */
@media(max-width:768px){
  .desktop-layout{display:none;}
  .mobile-panels{display:flex;flex-direction:column;flex:1;overflow:hidden;}
  .mobile-nav{display:block;}
  .topbar .ep-selector{display:none;}
  .m-panel{display:none;flex:1;overflow-y:auto;}
  .m-panel.on{display:flex;flex-direction:column;}
  .sidebar{border-right:none;overflow-y:auto;flex:1;}
  .ep-item{border-left:none;border-bottom:1px solid var(--border);}
}
@media(max-width:480px){
  .topbar{padding:0 10px;}
  .controls{padding:6px 8px;}
  .mode-bar{padding:5px 8px;}
}
</style>
</head>
<body>

<!-- ══ 登录页 ══ -->
<div id="login-page">
  <div class="login-box">
    <div class="login-logo">Vlog<span>英语</span></div>
    <div class="login-sub">用真实 Vlog 学地道英语</div>
    <input type="text" id="login-user" placeholder="账号" autocomplete="username">
    <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">进入学习</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-note">购买后账号密码将发送给你</div>
  </div>
</div>

<!-- ══ 主应用 ══ -->
<div id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo">Vlog<span>英语</span></div>
    <div class="ep-selector">
      <select id="ep-select" onchange="loadEpisode(this.value)"></select>
    </div>
    <div class="topbar-right">
      <span class="member-badge">★ 永久会员</span>
      <span class="logout-btn" onclick="doLogout()">退出</span>
    </div>
  </div>

  <!-- 桌面布局 -->
  <div class="desktop-layout">

    <!-- 左：课程列表 -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 中：视频+字幕 -->
    <div class="content">
      <div class="video-wrap" id="video-wrap"></div>

      <div class="controls">
        <div class="prog-wrap">
          <span class="time-lbl" id="cur-time">0:00</span>
          <input type="range" id="prog-bar" min="0" max="100" value="0" step="1" oninput="seekVideo(this.value)">
          <span class="time-lbl" id="dur-time">0:00</span>
        </div>
        <div class="ctrl-group">
          <button class="cbtn" onclick="setSpeed(this,0.75)">0.75x</button>
          <button class="cbtn on" onclick="setSpeed(this,1)" id="spd1">1x</button>
          <button class="cbtn" onclick="setSpeed(this,1.25)">1.25x</button>
          <button class="cbtn" onclick="setSpeed(this,1.5)">1.5x</button>
        </div>
        <button class="cbtn icon-btn" id="loop-btn" onclick="toggleLoop()" title="AB循环">↺</button>
        <button class="cbtn icon-btn" id="sub-btn" onclick="toggleSub()" title="字幕显示">字</button>
      </div>

      <div class="mode-bar">
        <span class="mode-lbl">模式</span>
        <button class="mbtn on" id="m-read" onclick="setMode('read')">阅读</button>
        <button class="mbtn" id="m-word" onclick="setMode('word')">划词</button>
        <button class="mbtn" id="m-sent" onclick="setMode('sent')">划句</button>
        <button class="mbtn" id="m-note" onclick="setMode('note')">笔记</button>
      </div>

      <div class="hint-strip" id="hint-strip">阅读模式：正常浏览字幕，点击时间戳跳转视频</div>

      <div class="subtitle-area" id="subtitle-area"></div>
    </div>

    <!-- 右：词汇面板 -->
    <div class="vocab-panel">
      <div class="vtab-bar">
        <div class="vtab on" onclick="switchVtab(this,'v-words')">单词</div>
        <div class="vtab" onclick="switchVtab(this,'v-phrases')">短语</div>
        <div class="vtab" onclick="switchVtab(this,'v-mine')">我的</div>
      </div>
      <div class="vpanel on" id="v-words"></div>
      <div class="vpanel" id="v-phrases"></div>
      <div class="vpanel" id="v-mine"></div>
    </div>

  </div>

  <!-- 手机面板 -->
  <div class="mobile-panels">
    <div class="m-panel on" id="mp-learn">
      <div class="video-wrap" id="m-video-wrap"></div>
      <div class="controls" style="flex-wrap:wrap;">
        <div class="prog-wrap" style="width:100%;">
          <span class="time-lbl" id="m-cur-time">0:00</span>
          <input type="range" id="m-prog-bar" min="0" max="100" value="0" step="1" oninput="seekVideo(this.value)">
          <span class="time-lbl" id="m-dur-time">0:00</span>
        </div>
        <div class="ctrl-group">
          <button class="cbtn" onclick="setSpeed(this,0.75)">0.75x</button>
          <button class="cbtn on" onclick="setSpeed(this,1)">1x</button>
          <button class="cbtn" onclick="setSpeed(this,1.25)">1.25x</button>
        </div>
        <button class="cbtn icon-btn" onclick="toggleLoop()">↺</button>
      </div>
      <div class="mode-bar" style="padding:5px 8px;">
        <span class="mode-lbl">模式</span>
        <button class="mbtn on" onclick="setMode('read')">阅读</button>
        <button class="mbtn" onclick="setMode('word')">划词</button>
        <button class="mbtn" onclick="setMode('sent')">划句</button>
        <button class="mbtn" onclick="setMode('note')">笔记</button>
      </div>
      <div class="hint-strip" id="m-hint-strip">点击时间戳跳转视频</div>
      <div class="subtitle-area" id="m-subtitle-area" style="flex:1;"></div>
    </div>
    <div class="m-panel" id="mp-vocab">
      <div class="vtab-bar">
        <div class="vtab on" onclick="switchVtab(this,'mv-words')">单词</div>
        <div class="vtab" onclick="switchVtab(this,'mv-phrases')">短语</div>
        <div class="vtab" onclick="switchVtab(this,'mv-mine')">我的</div>
      </div>
      <div class="vpanel on" id="mv-words" style="display:block;flex:1;overflow-y:auto;padding:10px;"></div>
      <div class="vpanel" id="mv-phrases" style="flex:1;overflow-y:auto;padding:10px;"></div>
      <div class="vpanel" id="mv-mine" style="flex:1;overflow-y:auto;padding:10px;"></div>
    </div>

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  const ok = ACCOUNTS.find(a => a.user === u && a.pass === p);
  if (!ok) { document.getElementById('login-err').textContent = '账号或密码错误，请重试'; return; }
  localStorage.setItem('vlog_user', u);
  enterApp();
}
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  localStorage.removeItem('vlog_user');
  location.reload();
}

function enterApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').classList.add('show');
  buildSidebar();
  buildEpSelect();
  loadEpisode(EPISODES[0].id);
  loadNotebook();
}

window.addEventListener('load', () => {
  const saved = localStorage.getItem('vlog_user');
  if (saved && ACCOUNTS.find(a => a.user === saved)) enterApp();
});

function buildSidebar() {
  ['sidebar','m-sidebar'].forEach(id => {
    const el = document.getElementById(id);

      EPISODES.map(ep => `

          <div class="ep-meta">
            <div class="ep-name">${ep.title}</div>
            <div class="ep-dur">${ep.duration}</div>
          </div>
          ${ep.isNew ? '<span class="ep-new">新</span>' : ''}
        </div>`).join('');
  });
}

function buildEpSelect() {
  const sel = document.getElementById('ep-select');
  sel.innerHTML = EPISODES.map(ep => `<option value="${ep.id}">${ep.id.replace('ep','第')}期 · ${ep.title}</option>`).join('');
}

function loadEpisode(id) {
  currentEp = EPISODES.find(e => e.id === id);
  if (!currentEp) return;

  // 激活侧边栏
  document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`#si-${id}`).forEach(el => el.classList.add('active'));
  document.getElementById('ep-select').value = id;

  // 重置状态
  myWords = []; mySents = []; myNotes = [];
  loadNotebook();

  // 渲染视频
  renderVideo();
  // 渲染字幕
  renderSubtitles();
  // 渲染词汇
  renderWords();
  renderPhrases();
  renderMine();
}

function renderVideo() {
  ['video-wrap','m-video-wrap'].forEach(id => {
    const wrap = document.getElementById(id);
    if (!wrap) return;
    const isMobile = id === 'm-video-wrap';
    const maxH = isMobile ? '35vw' : '42vh';

    if (currentEp.bvid) {
      // B站嵌入模式
      wrap.innerHTML = `
        <div style="position:relative;width:100%;aspect-ratio:16/9;max-height:${maxH};background:#000;">
          <iframe
            src="https://player.bilibili.com/player.html?bvid=${currentEp.bvid}&page=1&high_quality=1&danmaku=0&autoplay=0"
            style="width:100%;height:100%;border:none;display:block;"
            allowfullscreen
            allow="autoplay; fullscreen"
          ></iframe>
        </div>
        <div style="padding:6px 12px;background:var(--bg3);font-size:11px;color:var(--text3);border-bottom:1px solid var(--border);">
          ↑ B站播放器 · 倍速请点视频右键或播放器内设置 · 点击下方时间戳可跳转
        </div>`;
    } else if (currentEp.videoUrl) {
      // 本地/R2视频模式
      wrap.innerHTML = `<video id="${isMobile ? 'm-vid' : 'vid'}" src="${currentEp.videoUrl}" controls style="width:100%;display:block;max-height:${maxH};" preload="metadata"></video>`;
      const v = wrap.querySelector('video');
      if (!isMobile) videoEl = v;
      v.addEventListener('timeupdate', onTimeUpdate);
    } else {
      wrap.innerHTML = `<div class="no-video" style="aspect-ratio:16/9;max-height:${maxH};"><div style="color:var(--text2);font-size:12px;text-align:center;line-height:1.8;">暂无视频<br><span style="font-size:10px;opacity:0.5;">请填入 bvid 或 videoUrl</span></div></div>`;
    }
  });
}

/* ══════════════════════════════════════════
   ⑤ 视频控制
══════════════════════════════════════════ */
function getVideo() { return document.getElementById('vid') || document.getElementById('m-vid'); }

function onTimeUpdate() {
  const v = getVideo(); if (!v) return;
  const pct = v.duration ? (v.currentTime / v.duration * 100) : 0;
  ['prog-bar','m-prog-bar'].forEach(id => { const el = document.getElementById(id); if(el) el.value = Math.round(pct); });
  ['cur-time','m-cur-time'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = fmt(v.currentTime); });
  ['dur-time','m-dur-time'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = fmt(v.duration || 0); });
  highlightActiveSub(v.currentTime);
}

function fmt(s) {
  s = Math.round(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function seekVideo(pct) {
  const v = getVideo(); if (!v || !v.duration) return;
  v.currentTime = v.duration * pct / 100;
}

function setSpeed(btn, s) {
  const v = getVideo(); if(v) v.playbackRate = s;
  btn.closest('.ctrl-group').querySelectorAll('.cbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function toggleLoop() {
  loopActive = !loopActive;
  const btn = document.getElementById('loop-btn');
  if(btn) btn.classList.toggle('on', loopActive);
}

function toggleSub() {
  subVisible = !subVisible;
  document.querySelectorAll('.zh-line').forEach(el => el.style.display = subVisible ? '' : 'none');
  const btn = document.getElementById('sub-btn');
  if(btn) btn.classList.toggle('on', !subVisible);
}

function jumpToTime(t) {
  const v = getVideo();
  if (v) { v.currentTime = t; v.play(); }
}

/* ══════════════════════════════════════════
   ⑥ 字幕渲染
══════════════════════════════════════════ */
function renderSubtitles() {
  ['subtitle-area','m-subtitle-area'].forEach(areaId => {
    const area = document.getElementById(areaId);
    if (!area) return;
    area.innerHTML = currentEp.subtitles.map((s, i) => `
      <div class="sub-row" id="${areaId}-row-${i}" data-idx="${i}" data-t="${s.t}">
        <div class="sub-ts" onclick="jumpToTime(${s.t})">${fmt(s.t)}</div>
        <div class="en-line" id="${areaId}-en-${i}">${highlightPreset(s.en, i)}</div>
        <div class="zh-line">${s.zh}</div>
        <div class="sent-actions" id="${areaId}-sa-${i}">
          <button class="sa-btn" onclick="saveSent(${i})">🔖 收藏这句</button>
          <button class="sa-btn" onclick="openNoteModal(${i})">✏️ 加笔记</button>
          <button class="sa-btn" onclick="loopSent(${i})">↺ 单句循环</button>
        </div>
      </div>`).join('');

    // 划词事件
    area.addEventListener('mouseup', onTextSelect);
  });
}

function highlightPreset(en, idx) {
  if (!currentEp) return en;
  let result = en;
  // 高亮短语（先处理，避免单词覆盖）
  currentEp.phrases.forEach(p => {
    const reg = new RegExp(`(${p.phrase.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')})`, 'gi');
    result = result.replace(reg, `<span class="hl-phrase" title="${p.mean}">$1</span>`);
  });
  // 高亮单词
  currentEp.words.forEach(w => {
    const reg = new RegExp(`\\b(${w.word})\\b`, 'gi');
    result = result.replace(reg, (m) => {
      if (m.includes('class=')) return m;
      return `<span class="hl-word" onclick="openWordModal(event,'${w.word}')">${m}</span>`;
    });
  });
  return result;
}

function highlightActiveSub(t) {
  const subs = currentEp?.subtitles;
  if (!subs) return;
  let active = -1;
  for (let i = 0; i < subs.length; i++) {
    if (t >= subs[i].t && (i === subs.length-1 || t < subs[i+1].t)) active = i;
  }
  ['subtitle-area','m-subtitle-area'].forEach(areaId => {
    subs.forEach((_, i) => {
      const row = document.getElementById(`${areaId}-row-${i}`);
      if (row) row.classList.toggle('active-line', i === active);
    });
    if (active >= 0) {
      const activeRow = document.getElementById(`${areaId}-row-${active}`);
      if (activeRow) activeRow.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  });
}

/* ══════════════════════════════════════════
   ⑦ 学习模式
══════════════════════════════════════════ */
const hintTexts = {
  read: '阅读模式：点击时间戳跳转视频，点击黄色单词查看详情',
  word: '划词模式：选中任意单词或短语，自动加入我的单词本',
  sent: '划句模式：点击任意字幕行，收藏或添加单句循环',
  note: '笔记模式：点击任意字幕行，给这句话写学习笔记',
};

function setMode(m) {
  playMode = m;
  document.querySelectorAll('.mbtn').forEach(b => b.classList.remove('on'));
  document.querySelectorAll(`[onclick*="setMode('${m}')"]`).forEach(b => b.classList.add('on'));
  ['hint-strip','m-hint-strip'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=hintTexts[m]; });

  // 句子操作栏 & 高亮
  ['subtitle-area','m-subtitle-area'].forEach(areaId => {
    document.querySelectorAll(`[id^="${areaId}-row-"]`).forEach((row, i) => {
      row.classList.remove('sent-hl');
      const sa = document.getElementById(`${areaId}-sa-${i}`);
      if (sa) sa.classList.remove('show');
      row.style.cursor = (m === 'sent' || m === 'note') ? 'pointer' : '';
      row.onclick = (m === 'sent' || m === 'note') ? () => onRowClick(areaId, i) : null;
    });
  });
}

function onRowClick(areaId, i) {
  if (playMode === 'sent') {
    document.querySelectorAll(`[id^="${areaId}-row-"]`).forEach((r,j) => {
      r.classList.remove('sent-hl');
      const sa = document.getElementById(`${areaId}-sa-${j}`);
      if(sa) sa.classList.remove('show');
    });
    const row = document.getElementById(`${areaId}-row-${i}`);
    if(row) row.classList.add('sent-hl');
    const sa = document.getElementById(`${areaId}-sa-${i}`);
    if(sa) sa.classList.add('show');
  } else if (playMode === 'note') {
    openNoteModal(i);
  }
}

function saveSent(i) {
  const s = currentEp.subtitles[i];
  if (!mySents.find(x => x.idx === i)) {
    mySents.push({ idx: i, en: s.en, zh: s.zh });
    renderMine();
  }
  ['subtitle-area','m-subtitle-area'].forEach(areaId => {
    const row = document.getElementById(`${areaId}-row-${i}`);
    if(row) row.classList.remove('sent-hl');
    const sa = document.getElementById(`${areaId}-sa-${i}`);
    if(sa) sa.classList.remove('show');
  });
}

function loopSent(i) {
  const s = currentEp.subtitles[i];
  const next = currentEp.subtitles[i+1];
  const end = next ? next.t : s.t + 15;
  const v = getVideo();
  if (!v) return;
  v.currentTime = s.t;
  v.play();
  loopActive = true;
  function checkLoop() {
    if (!loopActive) { v.removeEventListener('timeupdate', checkLoop); return; }
    if (v.currentTime >= end) { v.currentTime = s.t; }
  }
  v.addEventListener('timeupdate', checkLoop);
  ['subtitle-area','m-subtitle-area'].forEach(areaId => {
    const sa = document.getElementById(`${areaId}-sa-${i}`);
    if(sa) sa.classList.remove('show');
  });
}

/* ══════════════════════════════════════════
   ⑧ 划词
══════════════════════════════════════════ */
function onTextSelect(e) {
  if (playMode !== 'word') return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const text = sel.toString().trim();
  if (!text || text.length < 2 || text.length > 60) return;
  if (!myWords.find(w => w.text === text)) {
    myWords.push({ text });
    saveNotebook();
    renderMine();
  }
  sel.removeAllRanges();
}

/* ══════════════════════════════════════════
   ⑨ 单词弹窗
══════════════════════════════════════════ */
function openWordModal(e, wordKey) {
  if (e) e.stopPropagation();
  const d = currentEp?.words.find(w => w.word.toLowerCase() === wordKey.toLowerCase());
  if (!d) return;
  curWordData = d;
  document.getElementById('mw-word').textContent = d.word;
  document.getElementById('mw-ph').textContent = d.ph + ' · ' + d.pos;
  document.getElementById('mw-mean').textContent = d.mean;
  document.getElementById('mw-ex').textContent = d.ex;
  document.getElementById('mw-syns').innerHTML = d.syn.map(s => `<span class="wtag">${s}</span>`).join('');
  document.getElementById('word-overlay').classList.add('show');
}

function closeWordModal(e) {
  if (e && e.target !== document.getElementById('word-overlay')) return;
  document.getElementById('word-overlay').classList.remove('show');
}

function saveToNotebook() {
  if (!curWordData) return;
  if (!myWords.find(w => w.text === curWordData.word)) {
    myWords.push({ text: curWordData.word });
    saveNotebook();
    renderMine();
  }
  const btn = document.querySelector('.modal-save');
  btn.textContent = '✓ 已加入';
  setTimeout(() => { btn.textContent = '＋ 加入单词本'; document.getElementById('word-overlay').classList.remove('show'); }, 800);
}

/* ══════════════════════════════════════════
   ⑩ 笔记弹窗
══════════════════════════════════════════ */
function openNoteModal(i) {
  noteTargetIdx = i;
  const s = currentEp.subtitles[i];
  document.getElementById('nm-quote').textContent = '"' + s.en + '"';
  document.getElementById('nm-input').value = myNotes.find(n => n.idx === i)?.text || '';
  document.getElementById('note-overlay').classList.add('show');
  setTimeout(() => document.getElementById('nm-input').focus(), 50);
}

function closeNoteModal(e) {
  if (e && e.target !== document.getElementById('note-overlay')) return;
  document.getElementById('note-overlay').classList.remove('show');
}

function saveNoteEntry() {
  const text = document.getElementById('nm-input').value.trim();
  if (!text) { closeNoteModal(); return; }
  const s = currentEp.subtitles[noteTargetIdx];
  const ex = myNotes.findIndex(n => n.idx === noteTargetIdx);
  if (ex >= 0) myNotes[ex].text = text;
  else myNotes.push({ idx: noteTargetIdx, en: s.en, zh: s.zh, text });
  ['subtitle-area','m-subtitle-area'].forEach(areaId => {
    const row = document.getElementById(`${areaId}-row-${noteTargetIdx}`);
    if(row) row.classList.add('has-note');
  });
  saveNotebook();
  renderMine();
  closeNoteModal();
}

/* ══════════════════════════════════════════
   ⑪ 词汇面板渲染
══════════════════════════════════════════ */
function renderWords() {
  const html = currentEp?.words.map(w => `
    <div class="wcard" onclick="openWordModal(null,'${w.word}')">
      <div class="wcard-head"><span class="wword">${w.word}</span><span class="wph">${w.ph}</span><span class="wpos">${w.pos}</span></div>
      <div class="wmean">${w.mean}</div>
      <div class="wex">${w.ex}</div>
      <div class="wtags">${w.syn.map(s=>`<span class="wtag">${s}</span>`).join('')}</div>
    </div>`).join('') || '';
  ['v-words','mv-words'].forEach(id => { const el=document.getElementById(id); if(el) el.innerHTML=html; });
}

function renderPhrases() {
  const html = currentEp?.phrases.map(p => `
    <div class="pcard">
      <div class="pp">${p.phrase}</div>
      <div class="pm">${p.mean}</div>
      <div class="pe">${p.ex}</div>
      <div class="alt-lbl">同义替换</div>
      ${p.alt.map(a=>`<span class="atag">${a}</span>`).join('')}
    </div>`).join('') || '';
  ['v-phrases','mv-phrases'].forEach(id => { const el=document.getElementById(id); if(el) el.innerHTML=html; });
}

function renderMine() {
  let html = '';
  if (myWords.length) {
    html += `<div class="vsec-title">我划的词</div><div style="margin-bottom:12px;">${myWords.map((w,i)=>`<span class="nb-word-chip" onclick="removeWord(${i})" title="点击移除">${w.text} ✕</span>`).join('')}</div>`;
  }
  if (mySents.length) {
    html += `<div class="vsec-title">收藏的句子</div>` + mySents.map(s => {
      const note = myNotes.find(n => n.idx === s.idx);
      return `<div class="nb-sent"><div class="nb-sent-en">${s.en}</div><div class="nb-sent-zh">${s.zh}</div>${note?`<div class="nb-sent-note">笔记：${note.text}</div>`:''}</div>`;
    }).join('');
  }
  if (myNotes.length && !mySents.length) {
    html += `<div class="vsec-title">我的笔记</div>` + myNotes.map(n => `<div class="nb-note-item"><div class="nb-note-kw">"${n.en.substring(0,50)}..."</div><div class="nb-note-txt">${n.text}</div></div>`).join('');
  }
  if (!html) html = '<div class="nb-empty">使用划词、划句、笔记模式<br>内容会显示在这里</div>';
  html += `<button class="exp-btn" onclick="exportNotes()">↓ 导出我的笔记</button>`;
  ['v-mine','mv-mine'].forEach(id => { const el=document.getElementById(id); if(el) el.innerHTML=html; });
}

function removeWord(i) { myWords.splice(i,1); saveNotebook(); renderMine(); }

/* ══════════════════════════════════════════
   ⑫ 面板切换
══════════════════════════════════════════ */
function switchVtab(tab, panelId) {
  const bar = tab.closest('.vtab-bar');
  bar.querySelectorAll('.vtab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on');
  const wrap = bar.closest('.vocab-panel') || bar.closest('.m-panel');
  if (!wrap) return;
  wrap.querySelectorAll('.vpanel').forEach(p => p.classList.remove('on'));
  const target = document.getElementById(panelId);
  if (target) { target.classList.add('on'); target.style.display = 'block'; }
  if (panelId.includes('mine') || panelId.includes('mv-mine')) renderMine();
}

function switchMPanel(item, panelId) {
  document.querySelectorAll('.mnav-item').forEach(i => i.classList.remove('on'));
  item.classList.add('on');
  document.querySelectorAll('.m-panel').forEach(p => p.classList.remove('on'));
  const target = document.getElementById(panelId);
  if (target) target.classList.add('on');
}

/* ══════════════════════════════════════════
   ⑬ 本地存储
══════════════════════════════════════════ */
function saveNotebook() {
  const key = `vlog_nb_${currentEp?.id}`;
  localStorage.setItem(key, JSON.stringify({ words: myWords, sents: mySents, notes: myNotes }));
}

function loadNotebook() {
  const key = `vlog_nb_${currentEp?.id}`;
  const raw = localStorage.getItem(key);
  if (raw) { try { const d=JSON.parse(raw); myWords=d.words||[]; mySents=d.sents||[]; myNotes=d.notes||[]; } catch(e){} }
  renderMine();
}

function exportNotes() {
  let out = `=== Vlog英语 第${currentEp?.id?.replace('ep','')}期 学习笔记 ===\n\n`;
  if (myWords.length) out += '【我划的词】\n' + myWords.map(w=>w.text).join('、') + '\n\n';
  if (mySents.length) { out += '【收藏的句子】\n'; mySents.forEach(s => { out += s.en + '\n' + s.zh + '\n'; const n=myNotes.find(n=>n.idx===s.idx); if(n) out+='笔记：'+n.text+'\n'; out+='\n'; }); }
  if (!myWords.length && !mySents.length) { alert('还没有内容，先划词或收藏句子吧！'); return; }
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(out);
  a.download = `Vlog英语_第${currentEp?.id?.replace('ep','')}期_笔记.txt`;
  a.click();
}
</script>
</body>
</html>
